[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI pattern: Depends() in function default arguments
    "E501",  # Line too long (handled by formatter / natural long migration & seed strings)
    "E712",  # SQLAlchemy boolean clauses: Model.is_active == True
]

[tool.ruff.lint.per-file-ignores]
"backend/app/main.py" = ["E402"]
"backend/app/tests/conftest.py" = ["E402"]
"backend/seed_data.py" = ["E402"]
"backend/alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/app/tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyrefly]
search-path = ["backend"]
site-package-path = ["C:/Users/varap/AppData/Local/Programs/Python/Python314/Lib/site-packages"]
python-interpreter = "C:/Users/varap/AppData/Local/Programs/Python/Python314/python.exe"

[tool.pyrefly.errors]
bad-argument-type = false
