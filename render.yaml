services:
  - type: web
    name: alcodelivery-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALCOHOL_TRANSACTIONS_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://alco-rez.vercel.app,https://alcorez.onrender.com,https://alcorez-frontend.onrender.com,http://localhost:5173,http://localhost:3000"

  - type: static
    name: alcodelivery-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://alcorez.onrender.com/api/v1
